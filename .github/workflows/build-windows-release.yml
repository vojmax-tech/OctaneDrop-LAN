name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Windows Onedir Bundle
        shell: pwsh
        working-directory: python
        run: |
          python -m PyInstaller --noconfirm --clean voltdrop_onedir.spec

      - name: Package ZIP + SHA256
        shell: pwsh
        run: |
          $zip = "python/dist/VoltDrop-windows.zip"
          Compress-Archive -Path "python/dist/VoltDrop/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "python/dist/VoltDrop-windows.zip.sha256" -Value "$hash  VoltDrop-windows.zip" -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltDrop-windows
          path: |
            python/dist/VoltDrop-windows.zip
            python/dist/VoltDrop-windows.zip.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "python/dist/VoltDrop-windows.zip"
          $sha = "python/dist/VoltDrop-windows.zip.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber
          } else {
            gh release create $tag $zip $sha --title "VoltDrop $tag" --generate-notes
          }
